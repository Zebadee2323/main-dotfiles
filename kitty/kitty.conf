background_opacity 0.92
background #272727
dynamic_background_opacity yes

font_family      LiterationMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 13.0

draw_minimal_borders no
hide_window_decorations yes

# Use a legacy function key so Cmd+C survives tmux. Neovim maps F12 to
# copying the current visual selection; Ctrl+Shift+C remains Kitty-native copy.
map cmd+c send_key f12
