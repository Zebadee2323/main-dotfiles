set-option -g update-environment "DISPLAY WAYLAND_DISPLAY XDG_RUNTIME_DIR"

set -g prefix C-a
unbind C-b
set -g mouse on
setw -g mode-keys vi

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"

# Colors tuned for Kitty's #272727 background.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

set -g status on
set -g status-position bottom
set -g status-style bg="#444444",fg="#d7d7d7"
set -g status-left-length 40
set -g status-right-length 90
set -g status-left-style fg="#8fd7ff",bg="#444444",bold
set -g status-right-style fg="#bcbcbc",bg="#444444"

set -g window-status-separator "  "
set -g window-status-style fg="#a8a8a8",bg="#444444"
set -g window-status-current-style fg="#272727",bg="#8fd7ff",bold
set -g window-status-activity-style fg="#ffd787",bg="#444444",bold
set -g window-status-bell-style fg="#272727",bg="#ff8787",bold

set -g pane-border-style fg="#4a4a4a"
set -g pane-active-border-style fg="#8fd7ff"

set -g message-style fg="#272727",bg="#ffd787",bold
set -g message-command-style fg="#272727",bg="#8fd7ff",bold
set -g mode-style fg="#272727",bg="#8fd7ff",bold

set -g clock-mode-colour "#8fd7ff"
