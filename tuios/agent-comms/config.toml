# Shared identity configuration. Read by default regardless of working directory.
display_seconds = 5
active_groups = ["phonon"] # Groups eligible for NEW random-bag draws.

# Required message introductions by the sender's relation to the viewed pane.
# Available fields: name, session, workspace, position. [] disables the prefix.
# Fields render in that fixed order. Fallback replaces fields if position is
# requested but geometry is unavailable. Restart the listener after edits.
[prefix.focused]
fields = []
fallback_fields = []
only_when_multiple_agents = false
omit_single_workspace = true

[prefix.same_workspace]
fields = ["name", "position"]
fallback_fields = ["name", "session"]
only_when_multiple_agents = true
omit_single_workspace = true

[prefix.different_workspace]
fields = ["name", "workspace"]
fallback_fields = ["name", "session"]
only_when_multiple_agents = false
omit_single_workspace = true

[prefix.different_session]
fields = ["name", "session"]
fallback_fields = ["name", "session"]
only_when_multiple_agents = false
omit_single_workspace = true

# Human identity injected by the harness plugins, separate from agent identities.
[user]
name = "Oli" # Written responses and --msg.
tts_name = "Ollie" # --tts pronunciation; defaults to name when omitted.

# Select local Pocket TTS / Phonon 31m or ElevenLabs. Credentials are read only
# from ELEVENLABS_API_KEY in watcher processes, never from this file.
[speech]
mode = "elevenlabs" # "pocket_tts", "phonon", or "elevenlabs".
model = "eleven_v4_turbo"
elevenlabs_speed = 1.0
phonon_speed = 1.0
pocket_tts_speed = 1.0
normalize = true # FFmpeg loudness normalization for watch; false keeps original levels.
robot_mode = true # Match Naia's robot voice effects; false disables effects.

# Runtime installed outside this repo with: uv tool install ptts==0.4.2
# Weights/voices download to the user Hugging Face cache, not the source tree.
[speech.phonon]
model = "hf://gradium/phonon-31m-en"
executable = "~/.local/bin/ptts"

# Installed outside the repo: uv tool install --python 3.11 pocket-tts==4.0.1
# Built-in voices use the public preset model; cached under ~/.cache/.
[speech.pocket_tts]
executable = "~/.local/bin/pocket-tts"
language = "english"
# Watcher keeps its model warm; voice states are loaded only when first used.
# Optional for nonstandard installs: python_executable = "/path/to/python"
# Identity pocket_tts_voice values accept presets ("alba") or local files:
# "voices/my-voice.wav" / "voices/my-voice.safetensors", relative to this config.
# Absolute paths and ~/ paths also work. Only clone recordings with permission.

