# Voice matches use catalog descriptions, not audio auditions. All IDs below were
# returned by the account's read-only GET /v2/voices on 2026-10-26 (no TTS generated).
# Voice catalog: https://elevenlabs.io/docs/api-reference/voices/search
# Catalog labels are comments for maintenance, not extra runtime config fields.
# Avoid voice-specific surcharges: check sharing.rate = 1.0 and no positive
# sharing.fiat_rate before assigning library voices; "professional" is a category,
# not a surcharge by itself. Standard model/plan usage charges still apply.

# Voice profiles: [voice_groups.GROUP.voices.PROFILE_ID]. Profile IDs are stable
# config keys, unique across groups, and never agent names. Every profile needs an
# explicit gender = "male" or "female"; keep each provider's voice the same gender
# so switching speech.mode never changes how an agent sounds. A profile can serve
# many agents; each agent keeps a snapshot of its profile until its binding clears.
# Optional elevenlabs_speed / phonon_speed = 0.7–1.2 in a profile overrides that
# provider's global speed. Legacy speed still works as a fallback.
# phonon_voice is a catalog name (ptts --list-voices); blank/missing is text-only
# in Phonon mode. voice-review saves phonon_voice_approved separately from
# ElevenLabs voice_approved.
# 24 profiles: one per conversational English Phonon voice (12 male / 12 female).
# ElevenLabs genders were checked against GET /v1/voices labels; "formerly" notes
# record the retired static identity that used each voice.
[voice_groups.phonon.voices.voice_trevor] # formerly Will (ag_376b7d0a)
